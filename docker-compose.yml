services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bookteka
      POSTGRES_PASSWORD: bookteka123
      POSTGRES_DB: bookteka_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookteka -d bookteka_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5433:5432"

  backend:
    build:
      context: ./backend-express
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://bookteka:bookteka123@db:5432/bookteka_db?schema=public
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8081}
      TRUST_BACKEND_ORIGINS: "true"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET must be set in .env}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:?R2_ACCESS_KEY_ID must be set in .env}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?R2_SECRET_ACCESS_KEY must be set in .env}
      R2_ENDPOINT: ${R2_ENDPOINT:?R2_ENDPOINT must be set in .env}
      R2_PUBLIC_DOMAIN: ${R2_PUBLIC_DOMAIN:?R2_PUBLIC_DOMAIN must be set in .env}
      R2_BUCKET: ${R2_BUCKET:?R2_BUCKET must be set in .env}
      RESEND_API_KEY: ${RESEND_API_KEY:?RESEND_API_KEY must be set in .env}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:?RESEND_FROM_EMAIL must be set in .env}
    ports:
      - "3001:3000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api/v1
    ports:
      - "8081:8080"
    depends_on:
      backend:
        condition: service_started

volumes:
  pgdata:
